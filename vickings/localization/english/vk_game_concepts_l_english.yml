l_english:
 game_concept_personal_union: "Personal Union"
 game_concept_personal_union_desc: "A Personal Union is a joining of two de jure independent realms and their associated [titles|E] under the rule of one monarch. It always consists of two partners: a higher-tier senior partner, and a lower-tier junior partner.\n\nPersonal Union partners often maintain distinct [succession_laws|E]. If, via succession, the titles end up with different [holders|E], the junior partner will become de facto independent of the senior partner, ending the Personal Union."
