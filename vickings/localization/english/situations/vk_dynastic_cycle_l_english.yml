l_english:
 cycle_history_key_rise_of_the_qing: "The Manchu Qing dynasty captures Beijing, ending the centuries-long reign of the Ming dynasty"
 cycle_history_key_fall_of_tungning: "The last remnants of the Ming in Taiwan surrender to Qing forces, ushering in an era of unprecedented expansion"
 cycle_history_key_end_of_the_ten_campaigns: "Qianlong's Ten Great Campaigns come to a close as China begins to retract inward, ending the era of the High Qing"
 cycle_history_key_white_lotus_rebellion: "Discontent masses, inspired by religious prophecy, rise up against the Qing dynasty, protesting against social and economic discontent"
 cycle_history_key_first_opium_war: "The humiliating defeat brought about by the British inaugurates the Century of Humiliation and finalizes the departure of China as a major global power"