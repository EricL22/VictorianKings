 tenet_protestant_literalism_name: "Sola Scriptura"
 tenet_protestant_literalism_desc: "Our holy texts clearly state divine intent. Though interpretations may differ, the faithful regard a return to Scripture as essential to the renewal and preservation of the true faith."
