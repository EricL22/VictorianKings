l_english:
 #Catholic-Group Faiths
 protestant:0 "Protestantism"
 protestant_adj:0 "Protestant"
 protestant_adherent:0 "Protestant"
 protestant_adherent_plural:0 "Protestants"
 protestant_desc:0 "Protestantism covers a wide range of religious traditions starting with the teachings of Martin Luther during the reformation. They react against a number of the conventions that over time have developed in the Catholic church and the idea of a pope itself."
 lutheran_rite: "Lutheran"
 lutheran_rite_adj: "Lutheran"
 lutheran_rite_adherent: "Lutheran"
 lutheran_rite_adherent_plural: "Lutherans"
 lutheran_rite_desc: "A mainline Protestant denomination following Luther's original teachings, in particular, the belief in ultimate salvation through faith and faith alone."

 reformed_rite:0 "Reformed"
 reformed_rite_adj:0 "Reformed"
 reformed_rite_adherent:0 "Calvinist"
 reformed_rite_adherent_plural:0 "Calvinists"
 reformed_rite_desc:0 "Reformed covers a wide range of religious traditions inspired by men such as Jean Calvin or John Knox. Appearing later than the Protestant faiths, the Reformed religion also rejects papal authority and want to return to the rules of the scriptures but unlike the Protestants they embrace a number of perceived more hard-line ideas such as predestination and iconoclasm and will not form state Churches."

 anglican_rite: "Anglican"
 anglican_rite_adj: "Anglican"
 anglican_rite_adherent: "Anglican"
 anglican_rite_adherent_plural: "Anglicans"
 anglican_rite_desc: "Originally formed when the King of England declared himself religious head of all Catholics in his realm, the Church of England has since adopted numerous Protestant practices in the wake of the Reformation. It presents itself as a #italic via media#! (middle way) between Catholicism and mainline Protestantism."

 godworship: "God-Worship"
 godworship_adj: "God-Worship"
 godworship_adherent: "God-Worshipper"
 godworship_adherent_plural: "God-Worshippers"
 godworship_desc: "The God-Worshipping Society is a nontrinitarian Christian syncretist movement founded by Hong Xiuquan, who proclaimed himself the younger brother of Jesus Christ. It emphasizes a highly strict moral code, the abolition of idols, and the concept of an egalitarian, communal society."
 godworship_religious_head_title: "Heavenly King"
 godworship_religious_head_title_female: "Heavenly Queen"
 godworship_religious_head_title_name: "Heavenly Kingdom"
 
